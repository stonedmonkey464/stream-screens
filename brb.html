<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium BRB Overlay - Toxic Green</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-green: #39ff14;
            --dark-green: #0a1f0a;
            --bg-color: #050505;
            --text-color: #ffffff;
            --hud-color: rgba(57, 255, 20, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-color);
        }

        /* --- BACKGROUND FALLBACK & VIDEO --- */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #112b11 0%, #000000 70%);
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85; /* Slightly more visible for the darker image */
        }

        /* --- OVERLAYS: SCANLINES & VIGNETTE --- */
        .overlay-scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        .overlay-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            box-shadow: inset 0 0 250px rgba(0, 0, 0, 0.95);
            pointer-events: none;
        }

        /* --- CANVAS PARTICLES --- */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            opacity: 0.5; /* Slightly calmer particles for BRB */
        }

        /* --- HUD ELEMENTS --- */
        .hud {
            position: absolute;
            z-index: 10;
            color: var(--hud-color);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.3);
        }

        .hud::before {
            content: '';
            position: absolute;
            background: var(--neon-green);
        }

        /* Top Left */
        .hud-tl {
            top: 40px;
            left: 40px;
            border-left: 2px solid var(--neon-green);
            padding-left: 10px;
        }

        /* Top Right: Radar & Status */
        .hud-tr {
            top: 40px;
            right: 40px;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .hud-tr svg {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0 0 5px var(--neon-green));
            overflow: visible;
        }

        /* Bottom Left: Terminal */
        .hud-bl {
            bottom: 40px;
            left: 40px;
            width: 300px;
            height: 100px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            font-size: 0.75rem;
            opacity: 0.7;
        }

        /* Bottom Right: Coordinates/System */
        .hud-br {
            bottom: 40px;
            right: 40px;
            text-align: right;
            border-right: 2px solid var(--neon-green);
            padding-right: 10px;
        }

        /* --- CENTER CONTENT --- */
        .center-container {
            position: absolute;
            top: 50%;
            left: 8%;
            transform: translateY(-50%);
            z-index: 20;
            text-align: left;
            width: 50%;
            max-width: 900px;
        }

        /* Glitch Text Effect */
        .glitch-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .glitch-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 5.5rem; /* Slightly smaller to fit "BE RIGHT BACK" cleanly */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 0 20px var(--neon-green), 0 0 40px var(--dark-green);
            position: relative;
            display: inline-block;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch-text::before {
            left: 3px;
            text-shadow: -2px 0 #ff0000;
            clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
            animation: glitch-anim 4s infinite linear alternate-reverse; /* Slower glitch for idle mode */
        }

        .glitch-text::after {
            left: -3px;
            text-shadow: -2px 0 var(--neon-green);
            clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
            animation: glitch-anim2 3.5s infinite linear alternate-reverse;
        }

        /* Countdown Timer */
        .countdown-timer {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--neon-green);
            letter-spacing: 5px;
            margin-top: -10px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px var(--neon-green);
        }

        /* Scanner Bar (Replaces progress bar for an idle state) */
        .progress-container {
            width: 80%;
            margin: 30px 0;
            position: relative;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(10, 31, 10, 0.8);
            border: 1px solid rgba(57, 255, 20, 0.3);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .scanner-fill {
            height: 100%;
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
            width: 20%;
            position: absolute;
            left: 0;
            animation: scan-idle 4s ease-in-out infinite alternate;
        }

        .progress-brackets {
            position: absolute;
            top: -10px;
            left: -20px;
            right: -20px;
            bottom: -10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .progress-brackets::before, .progress-brackets::after {
            content: '';
            width: 15px;
            height: 100%;
            border: 2px solid var(--hud-color);
        }
        .progress-brackets::before {
            border-right: none;
        }
        .progress-brackets::after {
            border-left: none;
        }

        /* Sub Status Text */
        .status-text {
            font-size: 1.2rem;
            color: var(--neon-green);
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse-opacity 3s infinite;
        }

        /* --- ANIMATIONS --- */
        @keyframes glitch-anim {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); }
            40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); }
            60% { clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%); }
            80% { clip-path: polygon(0 33%, 100% 33%, 100% 33%, 0 33%); }
            100% { clip-path: polygon(0 44%, 100% 44%, 100% 44%, 0 44%); }
        }

        @keyframes glitch-anim2 {
            0% { clip-path: polygon(0 25%, 100% 25%, 100% 30%, 0 30%); }
            20% { clip-path: polygon(0 3%, 100% 3%, 100% 3%, 0 3%); }
            40% { clip-path: polygon(0 5%, 100% 5%, 100% 20%, 0 20%); }
            60% { clip-path: polygon(0 20%, 100% 20%, 100% 20%, 0 20%); }
            80% { clip-path: polygon(0 23%, 100% 23%, 100% 23%, 0 23%); }
            100% { clip-path: polygon(0 50%, 100% 50%, 100% 50%, 0 50%); }
        }

        @keyframes scan-idle {
            0% { left: -20%; width: 20%; }
            50% { width: 40%; }
            100% { left: 100%; width: 20%; }
        }

        @keyframes pulse-opacity {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

    </style>
</head>
<body>

    <!-- Video & Background -->
    <div class="bg-container">
        <!-- 
            OBS INSTRUCTIONS: 
            Place 'brb.mp4' in the same folder as this HTML file.
        -->
        <video id="bg-video" autoplay loop muted playsinline>
            <source src="brb.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Aesthetic Overlays -->
    <canvas id="particles-canvas"></canvas>
    <div class="overlay-scanlines"></div>
    <div class="overlay-vignette"></div>

    <!-- HUD Elements -->
    <div class="hud hud-tl">
        SYS.CORE_v2.4.1 <br>
        <span style="font-size: 0.7em; opacity: 0.7; color: #ffcc00;">[STANDBY MODE]</span>
    </div>

    <div class="hud hud-tr">
        <div>
            STATUS: <span style="color: #ffcc00;">IDLE</span><br>
            THREAT LEVEL: <span style="color: var(--neon-green);">MONITORING</span>
        </div>
        <!-- Premium Tactical Radar / Sensor SVG -->
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Outer rotating dashed ring -->
            <circle cx="50" cy="50" r="42" fill="none" stroke="var(--neon-green)" stroke-width="2" stroke-dasharray="10 6" opacity="0.9">
                <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="12s" repeatCount="indefinite" />
            </circle>
            <!-- Inner solid ring -->
            <circle cx="50" cy="50" r="32" fill="none" stroke="var(--neon-green)" stroke-width="1" opacity="0.4" />
            <!-- Center dot pulsing -->
            <circle cx="50" cy="50" r="6" fill="var(--neon-green)">
                <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
            </circle>
            <!-- Crosshairs -->
            <line x1="50" y1="2" x2="50" y2="12" stroke="var(--neon-green)" stroke-width="2" opacity="0.8" />
            <line x1="50" y1="88" x2="50" y2="98" stroke="var(--neon-green)" stroke-width="2" opacity="0.8" />
            <line x1="2" y1="50" x2="12" y2="50" stroke="var(--neon-green)" stroke-width="2" opacity="0.8" />
            <line x1="88" y1="50" x2="98" y2="50" stroke="var(--neon-green)" stroke-width="2" opacity="0.8" />
        </svg>
    </div>

    <div class="hud hud-bl" id="terminal">
        <!-- Terminal lines generated by JS -->
    </div>

    <div class="hud hud-br">
        OPERATOR: <span style="color: #ffcc00;">AWAY</span><br>
        <span id="hex-clock" style="font-size: 1.2em; font-weight: bold; text-shadow: 0 0 8px var(--neon-green);"></span>
    </div>

    <!-- Center Typography & Loaders -->
    <div class="center-container">
        <div class="glitch-wrapper">
            <h1 class="glitch-text" data-text="BE RIGHT BACK">BE RIGHT BACK</h1>
        </div>
        
        <!-- Timer Element -->
        <div class="countdown-timer" id="countdown-timer">ETA: 05:00</div>
        
        <div class="progress-container">
            <div class="progress-brackets"></div>
            <div class="progress-track">
                <!-- Switched to a scanner bar for idle state -->
                <div class="scanner-fill"></div>
            </div>
        </div>

        <div class="status-text" id="status-text">SYSTEM IN STANDBY...</div>
    </div>

    <script>
        // --- 0. COUNTDOWN TIMER ---
        let timerSeconds = 5 * 60; // 5 minutos por defecto. Cambia el '5' por los minutos que quieras.
        const timerElement = document.getElementById('countdown-timer');
        
        const timerInterval = setInterval(() => {
            if (timerSeconds > 0) {
                timerSeconds--;
                const minutes = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const seconds = (timerSeconds % 60).toString().padStart(2, '0');
                timerElement.innerText = `ETA: ${minutes}:${seconds}`;
            } else {
                // Lo que pasa cuando el contador llega a cero
                timerElement.innerText = "SYSTEM READY";
                timerElement.style.color = "#ffcc00"; 
                timerElement.style.textShadow = "0 0 15px #ffcc00";
                clearInterval(timerInterval);
            }
        }, 1000);

        // --- 1. SUBTEXT UPDATER (IDLE THEME) ---
        const statusPhrases = [
            "SYSTEM IN STANDBY...",
            "OPERATOR AWAY...",
            "MAINTAINING SECURE CONNECTION...",
            "RECALIBRATING SENSORS...",
            "AWAITING OPERATOR RETURN...",
            "MONITORING ENVIRONMENT...",
            "GATHERING INTEL..."
        ];
        
        const statusElement = document.getElementById('status-text');
        
        setInterval(() => {
            const randomPhrase = statusPhrases[Math.floor(Math.random() * statusPhrases.length)];
            statusElement.innerText = randomPhrase;
        }, 5000); // Slightly slower updates for idle mode

        // --- 2. TERMINAL EFFECT (IDLE THEME) ---
        const terminal = document.getElementById('terminal');
        const processes = [
            "idle_loop()", "awaiting_input", "auth_token_refresh",
            "ping 127.0.0.1", "monitor_vitals()", "sys.standby_mode(true)",
            "scanning_perimeter...", "holding_connection", "power_saving_mode"
        ];

        function addTerminalLine() {
            const line = document.createElement('div');
            const isHex = Math.random() > 0.6; // Less hex strings, more processes
            
            if(isHex) {
                let hex = "0x";
                for(let i=0; i<8; i++) {
                    hex += Math.floor(Math.random()*16).toString(16).toUpperCase();
                }
                line.innerText = `> MEM_ADDR: [${hex}] ZzZ`;
            } else {
                const proc = processes[Math.floor(Math.random() * processes.length)];
                line.innerText = `> EXEC: ${proc}`;
            }

            terminal.appendChild(line);

            if (terminal.childElementCount > 5) {
                terminal.removeChild(terminal.firstChild);
            }
        }

        setInterval(addTerminalLine, 1200); // Slower terminal typing
        addTerminalLine(); 

        // --- 3. HEX CLOCK / DATA STREAM ---
        const hexClock = document.getElementById('hex-clock');
        setInterval(() => {
            let dataStream = "";
            for(let i=0; i<6; i++) {
                dataStream += Math.floor(Math.random()*16).toString(16).toUpperCase();
            }
            hexClock.innerText = `IDLE_STREAM: ${dataStream}`;
        }, 250);

        // --- 4. GREEN ENERGY PARTICLES (CANVAS) ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25; // Slower drift
                this.speedY = Math.random() * -0.5 - 0.2; // Slower upwards drift
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
                
                if(Math.random() > 0.98) {
                    this.opacity = Math.random() * 0.6 + 0.2;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(57, 255, 20, ${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#39ff14';
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < 50; i++) { // Slightly fewer particles for idle mode
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
